apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: laperla
spec:
  selector:
    app: laperla-app
  ports:
  - port: 9000
    targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: laperla
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laperla-app
  template:
    metadata:
      labels:
        app: laperla-app
    spec:
      imagePullSecrets:
      - name: dockerhub
      containers:
      - name: app
        image: purging/mitch:1.0.2
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: laperla-config
        - secretRef:
            name: laperla
        ports:
        - containerPort: 9000
          name: phpfpm
        readinessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 15
        livenessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
