apiVersion: v1
kind: ConfigMap
metadata:
  name: laperla-config
  namespace: laperla
data:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://laperla.kube.ruitenbeek.dev
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: "true"
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  DB_CONNECTION: mariadb
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: mitch
  DB_USERNAME: mitch
