apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: laperla
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: laperla
spec:
  selector:
    app: laperla-db
  ports:
  - port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: laperla
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: laperla-db
  template:
    metadata:
      labels:
        app: laperla-db
    spec:
      containers:
      - name: db
        image: mariadb:11
        env:
        - name: MARIADB_DATABASE
          value: mitch
        - name: MARIADB_USER
          value: mitch
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: laperla
              key: DB_ROOT_PASSWORD
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: laperla
              key: DB_PASSWORD
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - mariadb-admin ping -h 127.0.0.1 -u root -p"${MARIADB_ROOT_PASSWORD}" --silent
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - mariadb-admin ping -h 127.0.0.1 -u root -p"${MARIADB_ROOT_PASSWORD}" --silent
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: db-data
