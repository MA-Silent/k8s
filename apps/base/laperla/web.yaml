apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: laperla
spec:
  selector:
    app: laperla-web
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: laperla
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laperla-web
  template:
    metadata:
      labels:
        app: laperla-web
    spec:
      containers:
      - name: web
        image: purging/mitch-web:1.0.3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 30
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
