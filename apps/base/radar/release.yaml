apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
  namespace: radar
spec:
  interval: 50m
  releaseName: radar
  chart:
    spec:
      chart: radar
      sourceRef:
        kind: HelmRepository
        name: skyhook
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure