apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: idm-route
  namespace: kanidm
spec:
  parentRefs:
    - name: shared-gateway
      namespace: default
  hostnames:
    - "idm.kube.ruitenbeek.dev"
  rules:
    - backendRefs:
        - name: kanidm
          namespace: kanidm
          port: 8443