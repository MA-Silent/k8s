apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: idm-route
  namespace: kanidm
spec:
  parentRefs:
    - name: shared-gateway
      namespace: default
  hostnames:
    - "idm.kube.ruitenbeek.dev"
  rules:
    - backendRefs:
        - name: kanidm
          namespace: kanidm
          port: 443

---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: kanidm-backend-tls
  namespace: kanidm
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: kanidm
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: kanidm
    hostname: idm.kube.ruitenbeek.dev