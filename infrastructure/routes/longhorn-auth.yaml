---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: longhorn-authentik
  namespace: longhorn-system
spec:
  type: ExtAuth
  extAuth:
    headersToForward: 
        - Cookie
    httpService:
      backendRef:
        name: authentik-server
        namespace: default
        port: 80
      pathPrefix: /outpost.goauthentik.io/auth/envoy
      requestTimeout: 5s
      authorizationResponse:
        headersToClient:
          - location
          - set-cookie
          - www-authenticate

        headersToClientOnSuccess:
          - set-cookie
        
        headersToBackend:
          - authorization
          - x-authentik-username
          - x-authentik-groups
          - x-authentik-entitlements
          - x-authentik-email
          - x-authentik-name
          - x-authentik-uid

---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: longhorn-authentik
  namespace: longhorn-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: longhorn-route
  extAuth:
    extensionRef:
      name: longhorn-authentik

---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-longhorn-system-to-authentik
  namespace: default
spec:
  from:
    - group: gateway.kgateway.dev
      kind: GatewayExtension
      namespace: longhorn-system
  to:
    - group: ""
      kind: Service
      name: authentik-server

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-authentik-outpost
  namespace: default
spec:
  parentRefs:
    - name: shared-gateway
      namespace: default
  hostnames:
    - lh.kube.ruitenbeek.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        - name: authentik-server
          port: 80
